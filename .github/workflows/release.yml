name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build web assets
        run: npm run typecheck && npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore

      - name: Grant execute permission on gradlew
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          LOBOTOMI_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          LOBOTOMI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOBOTOMI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOBOTOMI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="0.1.0-${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/lobotomi-${VERSION}.apk"
          (cd release-artifacts && sha256sum "lobotomi-${VERSION}.apk" > "lobotomi-${VERSION}.apk.sha256")
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_TAG }}
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
